<style>.uni-rev{--uni-accent:#f0932b;--uni-star:#f5a623;--uni-text:#1f2328;--uni-muted:#6b7280;--uni-border:#e6e8eb;--uni-bg-bar:#eef0f2;max-width:1200px;margin:0 auto;padding:40px 20px;color:var(--uni-text);font-family:inherit}.uni-rev *,.uni-rev *::before,.uni-rev *::after{box-sizing:border-box}.uni-rev__layout{display:grid;grid-template-columns:1fr;gap:32px}@media (min-width:900px){.uni-rev__layout{grid-template-columns:260px 1fr;gap:48px;align-items:start}.uni-rev__summary{position:sticky;top:24px}}.uni-rev__score{font-size:58px;font-weight:800;line-height:1;letter-spacing:-1px}.uni-rev__summary-stars{margin:6px 0 4px}.uni-rev__summary-sub{font-size:13px;color:var(--uni-muted)}.uni-rev__bars{margin-top:18px;display:flex;flex-direction:column;gap:7px}.uni-rev__bar-row{display:flex;align-items:center;gap:8px;font-size:13px}.uni-rev__bar-label{width:10px;text-align:right;color:var(--uni-muted);font-weight:600}.uni-rev__bar-star{width:12px;height:12px;flex:0 0 auto}.uni-rev__bar-track{position:relative;flex:1;height:8px;border-radius:999px;background:var(--uni-bg-bar);overflow:hidden}.uni-rev__bar-fill{position:absolute;inset:0 auto 0 0;background:#111;border-radius:999px;width:0;transition:width .6s ease}.uni-rev__bar-count{width:34px;text-align:right;color:var(--uni-muted);font-variant-numeric:tabular-nums}.uni-rev__tab{font-size:20px;font-weight:700;padding-bottom:12px;border-bottom:2px solid var(--uni-text);display:inline-block;margin:0 0 20px}.uni-rev__toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}.uni-rev__search{position:relative;flex:1 1 240px;min-width:200px}.uni-rev__search input{width:100%;height:42px;padding:0 14px 0 40px;border:1px solid var(--uni-border);border-radius:8px;font-size:14px;color:var(--uni-text);background:#fff}.uni-rev__search input:focus{outline:none;border-color:var(--uni-accent)}.uni-rev__search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--uni-muted)}.uni-rev__write{height:42px;padding:0 22px;background:var(--uni-accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:filter .15s ease}.uni-rev__write:hover{filter:brightness(0.94)}.uni-rev__sort{height:42px;padding:0 12px;border:1px solid var(--uni-border);border-radius:8px;font-size:13px;color:var(--uni-text);background:#fff;cursor:pointer}.uni-rev__list{display:flex;flex-direction:column;gap:16px}.uni-rev__card{border:1px solid var(--uni-border);border-radius:12px;padding:20px 22px;background:#fff}.uni-rev__card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.uni-rev__id{display:flex;gap:12px;align-items:center}.uni-rev__avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 auto}.uni-rev__name-line{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}.uni-rev__flag{font-size:14px;line-height:1}.uni-rev__date{font-size:12px;color:var(--uni-muted);margin-top:2px}.uni-rev__rating{text-align:right;flex:0 0 auto}.uni-rev__rating-label{font-size:11px;color:var(--uni-muted);display:block;margin-bottom:3px}.uni-rev__verified{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-size:12px;font-weight:600;color:#1a7f37}.uni-rev__verified svg{width:14px;height:14px}.uni-rev__text{margin:12px 0 0;font-size:14.5px;line-height:1.55;color:#3a3f45}.uni-rev__stars{display:inline-flex;gap:2px}.uni-rev__stars svg{width:15px;height:15px}.uni-rev__summary-stars svg{width:18px;height:18px}.uni-rev__more{margin:24px auto 0;display:block;padding:12px 26px;background:transparent;color:var(--uni-text);border:1px solid var(--uni-text);border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s ease,color .15s ease}.uni-rev__more:hover{background:var(--uni-text);color:#fff}.uni-rev__empty{padding:32px 0;text-align:center;color:var(--uni-muted);font-size:14px}.uni-rev__modal{position:fixed;inset:0;z-index:9999;display:none}.uni-rev__modal.is-open{display:block}.uni-rev__modal-bg{position:absolute;inset:0;background:rgba(17,19,24,.55)}.uni-rev__modal-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:14px;padding:26px}.uni-rev__modal-title{font-size:19px;font-weight:800;margin:0 0 4px}.uni-rev__modal-sub{font-size:13px;color:var(--uni-muted);margin:0 0 18px}.uni-rev__field{margin-bottom:14px}.uni-rev__field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.uni-rev__field input,.uni-rev__field textarea{width:100%;border:1px solid var(--uni-border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--uni-text)}.uni-rev__field input:focus,.uni-rev__field textarea:focus{outline:none;border-color:var(--uni-accent)}.uni-rev__field textarea{min-height:96px;resize:vertical}.uni-rev__rate-pick{display:inline-flex;gap:4px;cursor:pointer}.uni-rev__rate-pick svg{width:26px;height:26px}.uni-rev__modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}.uni-rev__btn-ghost,.uni-rev__btn-solid{height:42px;padding:0 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}.uni-rev__btn-ghost{background:#fff;border:1px solid var(--uni-border);color:var(--uni-text)}.uni-rev__btn-solid{background:var(--uni-accent);color:#fff;border:none}.uni-rev__toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:13px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:10000}.uni-rev__toast.is-show{opacity:1;transform:translateX(-50%) translateY(0)}</style>
<section
  class="uni-rev"
  id="uni-rev-{{ product.id }}"
  data-handle="{{ product.handle }}"
  data-seed="{{ product.id | default: 0 }}"
  data-per-page="8"
  data-enable-write="true"
  data-enable-search="true">
<div class="uni-rev__layout">
<aside class="uni-rev__summary">
<div class="uni-rev__score" data-role="avg">0.0</div>
<div class="uni-rev__summary-stars" data-role="summary-stars"></div>
<div class="uni-rev__summary-sub">Na základě <span data-role="total">0</span> recenzí</div>
<div class="uni-rev__bars" data-role="bars"></div>
</aside>
<div class="uni-rev__reviews">
<h3 class="uni-rev__tab">Recenze (<span data-role="tab-count">0</span>)</h3>
<div class="uni-rev__toolbar">
<div class="uni-rev__search">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
<input type="search" data-role="search" placeholder="Hledat v recenzích" aria-label="Hledat v recenzích">
</div>
<select class="uni-rev__sort" data-role="sort" aria-label="Seřadit recenze">
<option value="recent">Nejnovější</option>
<option value="old">Nejstarší</option>
</select>
<button type="button" class="uni-rev__write" data-role="open-modal">Napsat recenzi</button>
</div>
<div class="uni-rev__list" data-role="list"></div>
<button type="button" class="uni-rev__more" data-role="more" hidden>Zobrazit další recenze</button>
</div>
</div>
<div class="uni-rev__modal" data-role="modal" aria-hidden="true" role="dialog" aria-modal="true">
<div class="uni-rev__modal-bg" data-role="close-modal"></div>
<div class="uni-rev__modal-box">
<h3 class="uni-rev__modal-title">Napsat recenzi</h3>
<p class="uni-rev__modal-sub">Podělte se o svou zkušenost s tímto produktem.</p>
<form data-role="review-form">
<div class="uni-rev__field">
<label>Hodnocení</label>
<span class="uni-rev__rate-pick" data-role="rate-pick"></span>
</div>
<div class="uni-rev__field">
<label for="uni-rev-name-{{ product.id }}">Jméno</label>
<input id="uni-rev-name-{{ product.id }}" type="text" name="name" required maxlength="60" placeholder="Vaše jméno">
</div>
<div class="uni-rev__field">
<label for="uni-rev-text-{{ product.id }}">Recenze</label>
<textarea id="uni-rev-text-{{ product.id }}" name="text" required maxlength="600" placeholder="Co se vám na produktu líbilo?"></textarea>
</div>
<div class="uni-rev__modal-actions">
<button type="button" class="uni-rev__btn-ghost" data-role="close-modal">Zrušit</button>
<button type="submit" class="uni-rev__btn-solid">Odeslat recenzi</button>
</div>
</form>
</div>
</div>
<div class="uni-rev__toast" data-role="toast"></div>
</section>

<script>!function(){var e={"bazen-marimex-orlando-4-57-x-1-07-m-s-prislusenstvim":[{n:"Alessandro R.",d:"27/07/2026",t:"Bazén je opravdu prostorný a perfektní pro osvěžení celé rodiny. Po napuštění je stabilní a působí velmi pevně."},{n:"Francesca M.",d:"21/07/2026",t:"Montáž vyžaduje trochu pozornosti, ale návod je přehledný. Konečný výsledek je skvělý."},{n:"Luca B.",d:"14/07/2026",t:"Rozměry jsou ideální pro naši zahradu. I děti si v něm mohou pohodlně hrát, aniž by měly málo prostoru."},{n:"Valentina C.",d:"06/07/2026",t:"Pevná konstrukce a odolná bazénová fólie. Doporučuji před montáží opravdu důkladně připravit a vyrovnat podklad."},{n:"Marco P.",d:"28/06/2026",t:"Pěkný, velký bazén se vším potřebným pro zahájení používání. Za tuto cenu jsme velmi spokojení."},{n:"Elena D.",d:"19/06/2026",t:"Používáme ho téměř každý den. Během horkých dnů se stal nejoblíbenějším místem celé rodiny."},{n:"Simone T.",d:"10/06/2026",t:"Je mnohem prostornější, než vypadal na fotografiích. Skvělý pro dospělé i děti."},{n:"Giulia F.",d:"31/05/2026",t:"I po několika týdnech je stále dokonale stabilní. Údržba je jednoduchá, pokud se pravidelně kontroluje kvalita vody."},{n:"Davide L.",d:"22/05/2026",t:"Celkově dobrá kvalita a užitečné příslušenství. Montáž je jednodušší, když vám pomáhá ještě jedna osoba."},{n:"Sara V.",d:"09/05/2026",t:"Skvělá koupě na léto. Je to skoro jako mít na zahradě skutečný trvalý bazén."},{n:"Cristina N.",d:"26/07/2026",t:"Velmi prostorný a kvalitně zpracovaný bazén. Po správném vyrovnání podkladu byla montáž poměrně jednoduchá."},{n:"Emanuele G.",d:"18/07/2026",t:"Konstrukce je stabilní a hloubka je vhodná i pro dospělé. Skvělý bazén pro letní chvíle s celou rodinou."},{n:"Roberta S.",d:"03/07/2026",t:"Dodávané příslušenství je užitečné a umožňuje začít bazén ihned používat. Fólie působí pevně a kvalitně."},{n:"Pietro A.",d:"12/06/2026",t:"Je dostatečně velký na hraní i pohodlný odpočinek. Ani po měsíci používání jsme nezaznamenali žádné problémy."}],"virivy-bazen-mspa-orbit-ls062":[{n:"Matteo G.",d:"29/07/2026",t:"Velmi relaxační a dostatečně prostorná vířivka. Používáme ji především večer po práci."},{n:"Chiara R.",d:"23/07/2026",t:"Bublinky jsou příjemné a po zahřátí si voda dobře udržuje teplotu."},{n:"Federico M.",d:"16/07/2026",t:"Jednoduchá montáž a intuitivní ovládací panel. Za krátkou dobu byla připravená k napuštění."},{n:"Alessia T.",d:"08/07/2026",t:"Pro dvě osoby je velmi pohodlná, ale dá se bez problémů používat i ve větší společnosti. Materiál působí odolně."},{n:"Stefano C.",d:"30/06/2026",t:"Malé domácí wellness. Perfektní pro odpočinek během chladnějších večerů."},{n:"Laura P.",d:"22/06/2026",t:"Masážní systém vytváří velké množství bublinek a celý zážitek je díky tomu opravdu příjemný."},{n:"Andrea F.",d:"13/06/2026",t:"Moderní design se skvěle hodí na naši terasu. Vířivka se také snadno čistí."},{n:"Martina S.",d:"04/06/2026",t:"Ohřev vody trvá několik hodin, ale jakmile dosáhne požadované teploty, pohodlí je výborné."},{n:"Gabriele D.",d:"26/05/2026",t:"Stabilní konstrukce a pohodlné stěny, o které se dá dobře opřít. S nákupem jsme spokojení."},{n:"Ilaria B.",d:"15/05/2026",t:"Používám ji o víkendech a pokaždé mám pocit, jako bych byla ve wellness centru."},{n:"Veronica L.",d:"25/07/2026",t:"Velmi pohodlná a relaxační vířivka. Bublinkový systém funguje dobře a vytváří příjemný masážní efekt."},{n:"Daniele V.",d:"17/07/2026",t:"Ovládací panel je intuitivní a konstrukce se rychle nafoukne. Používáme ji téměř každý večer."},{n:"Arianna C.",d:"02/07/2026",t:"Je prostorná, stabilní a snadno se udržuje čistá. Kryt dobře pomáhá udržovat teplotu vody."},{n:"Manuel P.",d:"11/06/2026",t:"Praktické řešení pro vytvoření relaxačního koutku na zahradě bez nutnosti trvalých stavebních úprav."}],"virivy-bazen-mspa-pebble-lr062-gr":[{n:"Roberto C.",d:"28/07/2026",t:"Vypadá krásně a je velmi pohodlná. Vnější povrch jí dodává elegantní vzhled."},{n:"Elisa M.",d:"20/07/2026",t:"Bublinky jsou dobře rozložené a dno zůs u nadšené a i my dospělí se v něm můžeme pohodlně osvěžit."},{n:"Cristian P.",d:"01/07/2026",t:"Kompletní a praktický bazén. Čerpadlo funguje dobře, pokud se pravidelně používá."},{n:"Anna T.",d:"23/06/2026",t:"Dobrá hloubka a odolné materiály. Na léto to byla skvělá volba."},{n:"Massimo D.",d:"15/06/2026",t:"Po sestavení vypadá opravdu dobře. Kovová konstrukce působí pevně a stabilně."},{n:"Beatrice F.",d:"06/06/2026",t:"Snadno se čistí a velikost je ideální pro naši čtyřčlennou rodinu."},{n:"Lorenzo B.",d:"29/05/2026",t:"Písková filtrace je rozhodně pohodlnější než naše staré kartušové čerpadlo."},{n:"Claudia V.",d:"18/05/2026",t:"Pěkný a funkční bazén. S použitím krycí plachty lze vodu snadno udržovat čistou."},{n:"Stefania B.",d:"27/07/2026",t:"Rozměry jsou ideální pro menší zahradu. Děti bazén používají prakticky každý den."},{n:"Loris M.",d:"15/07/2026",t:"Písková filtrace udržuje vodu průzračnou a vyžaduje méně údržby než naše předchozí kartušová filtrace."},{n:"Paola G.",d:"30/06/2026",t:"Pevná konstrukce a poměrně intuitivní montáž. Při sestavování je lepší být alespoň ve dvou."},{n:"Vincenzo E.",d:"09/06/2026",t:"Příjemná hloubka a odolné materiály. Praktický bazén pro osvěžení během celého léta."}],"wybot-c1-bezdratovy-roboticky-vysavac-do-bazenu":[{n:"Alberto R.",d:"29/07/2026",t:"Dobře vysbírá písek, listí i drobné nečistoty. Dno bazénu je výrazně čistší než dříve."},{n:"Patrizia M.",d:"22/07/2026",t:"Díky provozu bez kabelu je všechno mnohem jednodušší. Stačí ho vložit do vody a spustit čisticí cyklus."},{n:"Franco C.",d:"15/07/2026",t:"Dobrá výdrž baterie a poměrně důkladné vyčištění bazénu. Filtr se navíc snadno oplachuje."},{n:"Raffaella T.",d:"07/07/2026",t:"Pohybuje se spolehlivě a dokáže zachytit i jemnější nečistoty usazené na dně."},{n:"Giovanni P.",d:"29/06/2026",t:"Ušetřil mi spoustu času při pravidelné týdenní údržbě bazénu."},{n:"Lucia D.",d:"20/06/2026",t:"Snadno se používá i bez předchozích zkušeností. Nádoba na nečistoty se rychle otevír
